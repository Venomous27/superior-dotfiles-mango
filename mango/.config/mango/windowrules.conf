# =========================
# WINDOW RULES
# =========================
windowrule=focused_opacity:0.8,unfocused_opacity:0.8,appid:thunar

windowrule=isfloating:1,width:800,height:500,appid:^(com.gabm.satty)$
# NOTE: mango centers floating windows by default (unless no_force_center:1
# is set), so no separate "center" rule is needed here.

windowrule=focused_opacity:0.8,unfocused_opacity:0.8,title:^(Wall-Picker)$

windowrule=isfloating:1,width:800,height:500,appid:org.pulseaudio.pavucontrol

windowrule=isfloating:1,width:800,height:500,appid:blueman-manager

# NOTE: Hyprland's `blur on` layerrule enables blur for a layer; mango
# blurs layers by default once blur_layer=1 is set globally (see looks.conf -
# add blur_layer=1 there if you want blurred layer-shell surfaces like rofi).
# The `noblur:0` below is just an explicit "don't disable blur" for clarity.
layerrule=noblur:0,layer_name:rofi
# NOTE: "ignore_alpha" (rofi-wayland) has no equivalent layerrule parameter
# in mango - omitted.

windowrule=isfloating:1,width:800,height:500,appid:com.github.hluk.copyq

windowrule=isfloating:1,width:1000,height:700,appid:^(vlc)$,focused_opacity:1,unfocused_opacity:1
# NOTE: "dim_around" has no mango equivalent - omitted.

#windowrule=isfloating:1,width:1000,height:700,appid:^(kitty)$

windowrule=isfloating:1,width:1000,height:700,appid:^(mpv)$,focused_opacity:1,unfocused_opacity:1

windowrule=isfloating:1,width:1000,height:700,appid:^(org.kde.gwenview)$,focused_opacity:1,unfocused_opacity:1
