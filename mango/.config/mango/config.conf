# =========================
# MONITOR
# =========================

monitorrule=name:^eDP-1$,width:1920,height:1080,refresh:120,x:0,y:0,scale:1   #change this according to your monitor

# =========================
# ENV (NVIDIA + Wayland)
# =========================
env=LIBVA_DRIVER_NAME,nvidia
env=XDG_SESSION_TYPE,wayland
env=GBM_BACKEND,nvidia-drm
env=__GLX_VENDOR_LIBRARY_NAME,nvidia
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=QT_QPA_PLATFORM,wayland
env=XCURSOR_THEME,Oxygen 18 White
env=XCURSOR_SIZE,24
env=LANG,en_IN.UTF-8

# =========================
# CURSOR (NVIDIA fix)
# =========================
cursor_size=24
cursor_theme=Oxygen 18 White

# =========================
# General/Themes
# =========================

tagrule=id:1,monitor_name:eDP-1,layout_name:dwindle
tagrule=id:2,monitor_name:eDP-1,layout_name:dwindle
tagrule=id:3,monitor_name:eDP-1,layout_name:dwindle
tagrule=id:4,monitor_name:eDP-1,layout_name:dwindle
tagrule=id:5,monitor_name:eDP-1,layout_name:dwindle
tagrule=id:6,monitor_name:eDP-1,layout_name:dwindle
tagrule=id:7,monitor_name:eDP-1,layout_name:dwindle
tagrule=id:8,monitor_name:eDP-1,layout_name:dwindle
tagrule=id:9,monitor_name:eDP-1,layout_name:dwindle

focused_opacity=1.0
unfocused_opacity=0.4


# =========================
# INPUT
# =========================
xkb_rules_layout=us
sloppyfocus=1
mouse_accel_speed=-0.5
mouse_accel_profile=2

trackpad_natural_scrolling=1
drag_lock=1

# =========================
# LOOKS
# =========================

source=~/.config/mango/looks.conf
source=~/superior-dotfiles-mango/mango/.config/mango/color.conf

# =========================
# AUTOSTART
# =========================
source=~/.config/mango/autostart.conf

# =========================
# WINDOW RULES
# =========================
source=~/.config/mango/windowrules.conf

# =========================
# KEYBINDS
# =========================
source=~/.config/mango/keybinds.conf
