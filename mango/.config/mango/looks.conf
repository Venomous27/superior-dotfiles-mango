# =========================
# GENERAL (gaps / borders)
# =========================
gappih=5
gappiv=5
gappoh=10
gappov=10
borderpx=2

# =========================
# SCROLLER LAYOUT
# =========================
# Rough equivalent of your old `scrolling {}` block.
# mango's scroller layout has no explicit "direction" setting (Hyprland's
# scrolling:direction=right) - it always scrolls horizontally by default.
# There's also no direct match for fullscreen_on_one_column or
# focus_fit_method, so those are left as compositor defaults.
scroller_default_proportion=0.9
scroller_prefer_center=1
scroller_focus_center=0
scroller_prefer_overspread=1

# =========================
# DECORATION
# =========================
border_radius=9
border_radius_location_default=0

blur=1
blur_params_radius=10
blur_params_num_passes=3
blur_params_contrast=1.1

shadows=0

# =========================
# ANIMATIONS
# =========================
animations=1
layer_animations=1

animation_type_open=slide
animation_type_close=slide

# Your "fast" bezier (0.25, 0.9, 0.3, 1.0) applied across the animation types
# that correspond to Hyprland's windows/windowsOut/workspaces animations.
animation_curve_open=0.25,0.9,0.3,1.0
animation_curve_move=0.25,0.9,0.3,1.0
animation_curve_tag=0.25,0.9,0.3,1.0
animation_curve_close=0.25,0.9,0.3,1.0

# Durations (hyprland's "5" ~= 500ms, "4" ~= 400ms at default speed)
animation_duration_open=500
animation_duration_close=500
animation_duration_tag=500
animation_duration_move=500
animation_duration_focus=400

# Fade animation (fade,1,5,default in your old config)
animation_fade_in=1
animation_fade_out=1
