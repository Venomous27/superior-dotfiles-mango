# =========================
# AUTOSTART
# =========================
exec-once=nm-applet
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=mango
exec-once=awww-daemon
exec-once=udiskie &
exec-once=gnome-keyring-daemon --start --components=secrets
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once=swaync

# NOTE: hypridle and hyprpm are Hyprland-specific and have no mango
# equivalent - they were removed. For idle management under mango,
# consider swayidle instead, e.g.:
# exec-once=swayidle -w timeout 300 'swaylock -f'

# NOTE: "wayle shell" was a Hyprland-oriented shell/dashboard - keep it
# only if it doesn't depend on Hyprland-specific IPC (hyprctl).
exec-once=wayle shell

exec-once=wl-paste --type text --watch cliphist store
exec-once=wl-paste --type image --watch cliphist store

