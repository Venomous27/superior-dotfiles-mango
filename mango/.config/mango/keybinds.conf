# =========================
# KEYBINDS
# =========================

# Apps
bind=SUPER,Q,spawn,kitty
bind=SUPER,E,spawn,thunar
#bind=SUPER,E,spawn,kitty -e spf
bind=SUPER,space,spawn,/home/venom/.config/rofi/scripts/launcher.sh
bind=SUPER+SHIFT,E,spawn,/home/venom/.config/rofi/scripts/powermenu.sh
bind=SUPER,B,spawn,firefox
bind=SUPER,L,spawn,localsend

# Window controls
bind=ALT,code:49,killclient,                          # Alt+` to kill window
bind=SUPER,F,togglefullscreen,
bind=SUPER,T,spawn_shell, mmsg dispatch togglefloating && mmsg dispatch resizewin,1000,700 && mmsg dispatch centerwin

# Move focus (arrows)
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# Move windows
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

# Mouse move/resize floating windows
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Workspaces (tags)
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9


bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9


# Wallpaper
bind=SUPER,W,spawn,~/.config/rofi/scripts/wallpaper.sh

# Themes
bind=SUPER+SHIFT,T,spawn,~/.config/rofi/scripts/theme-switcher.sh

# Screenshot (uses a pipe, so spawn_shell instead of spawn)
bind=NONE,Print,spawn_shell,hyprshot -m region --raw | satty --filename -

# Clipboard history
bind=SUPER,V,spawn,~/.config/rofi/scripts/clipboard.sh

# Game mode (mango's setoption sets a config value at runtime, like hyprctl keyword)
bind=SUPER,G,setoption,animations,0
bind=SUPER,G,setoption,blur,0
bind=SUPER+SHIFT,G,setoption,animations,1
bind=SUPER+SHIFT,G,setoption,blur,1

# Volume
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Brightness
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-

# Emoji
bind=SUPER,slash,spawn,~/.config/rofimoji/emoji.sh

# Audio output picker
bind=SUPER+ALT,L,spawn,/home/venom/superior-dotfiles-mango/rofi/.config/rofi/scripts/audio-output.sh


bind=SUPER,period,focusstack,next
bind=SUPER,comma,focusstack,prev
bind=SUPER+SHIFT,period,exchange_client,right
bind=SUPER+SHIFT,comma,exchange_client,left

keymode=common
bind=SUPER,BackSpace,reload_config

# Change layout
bind=SUPER,n,spawn_shell,kitty --title="Floating-Menu" -e /home/venom/superior-dotfiles-mango/mango/.config/mango/layout-switcher.sh

# Send current window to scratchpad
bind=SUPER,i,minimized

# Toggle (show/hide) the scratchpad
bind=ALT,z,toggle_scratchpad

# Retrieve window from scratchpad (restore)
bind=SUPER+SHIFT,i,restore_minimized

#Gestures
gesturebind=MODIFIERS,DIRECTION,FINGERS,COMMAND,PARAMETERS
# 3-finger: Window focus
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down

# 4-finger: Workspace navigation
gesturebind=none,left,4,viewtoleft_have_client
gesturebind=none,right,4,viewtoright_have_client
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview

btn_forward= toggleoverview,
